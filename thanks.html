<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; form-action 'self' https://formsubmit.co; base-uri 'self'; object-src 'none'">
<title>Thank You · Sophon Finance</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/Fast-Tax-Machine-mark-color.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--text:#161616;--text-2:#525252;--blue:#0f62fe;--blue-hover:#0043ce;--border:#e0e0e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:48px 16px}
img{height:40px;width:auto;margin-bottom:64px}
h1{font-weight:300;font-size:clamp(32px,5vw,48px);line-height:1.1;margin:0 0 18px}
p{color:var(--text-2);font-size:18px;margin:0 0 28px}
a.btn{display:inline-block;background:var(--blue);color:#fff;padding:14px 22px;text-decoration:none;font-weight:500}
a.btn:hover{background:var(--blue-hover)}
</style>
</head>
<body>
<div class="wrap">
  <a href="/"><img src="assets/sophon_finance_on_light.svg" alt="Sophon Finance"></a>
  <h1>Thank you. Your message is on its way.</h1>
  <p>We reply personally within one business day, from contact@sophonfinance.com.</p>
  <a class="btn" href="/">Back to the machines</a>
</div>
</body>
</html>
